<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Detail Berita - AgroVoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e5c36; --secondary: #8ebd50; --dark: #1a2416; --bg: #f7f8f4; --card: #fff; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Figtree', sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; }
        a { text-decoration: none; color: inherit; }
        
        /* NAVBAR */
        .navbar { background: rgba(26, 36, 22, 0.95); backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; color: white; }
        .navbar h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; color: white; }
        .navbar h1 span { color: var(--secondary); }
        .navbar .menu a { margin-left: 20px; font-weight: 500; font-size: 15px; color: white; transition: color 0.2s; }
        .navbar .menu a:hover { color: var(--secondary); }

        /* ARTIKEL */
        .artikel-container { max-width: 800px; margin: 100px auto 40px auto; padding: 0 20px; min-height: 500px; }
        .meta-artikel { font-size: 14px; color: #666; margin-bottom: 20px; text-align: center; }
        .meta-artikel span { color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .artikel-container h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(28px, 5vw, 42px); color: var(--dark); text-align: center; margin-bottom: 20px; line-height: 1.2; }
        
        .artikel-container img.gambar-utama { width: 100%; max-height: 450px; object-fit: cover; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .isi-artikel { font-size: 18px; color: #444; white-space: pre-wrap; line-height: 1.8; }
        
        .btn-kembali { display: inline-block; margin-top: 40px; background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
        .btn-kembali:hover { background: var(--dark); }

        /* FOOTER */
        footer { background: var(--dark); color: #a0b8a6; text-align: center; padding: 30px 20px; margin-top: 60px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html"><h1>Agro<span>Voice</span></h1></a>
        <div class="menu">
            <a href="index.html">Beranda</a>
            <a href="berita.html">Berita</a>
            <a href="galeri.html">Galeri</a>
        </div>
    </nav>

    <main class="artikel-container" id="artikel-wrapper">
        <div style="text-align:center; padding: 80px 0; color: #888;">
            <p>Memuat isi berita...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AgroVoice AI. Semua hak dilindungi.</p>
    </footer>

    <script src="js/data.js"></script>
    <script>
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const fmtTanggal = t => {
            const d = new Date(String(t).replace(' ', 'T'));
            return isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        };

        function muatDetailBerita() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id') || '0', 10);
            const beritaList = (window.AGRO_DATA && window.AGRO_DATA.berita) ? window.AGRO_DATA.berita : [];
            const berita = beritaList.find(b => b.id === id);
            const container = document.getElementById('artikel-wrapper');

            if (!berita) {
                document.getElementById('page-title').innerText = 'Berita Tidak Ditemukan - AgroVoice';
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2 style="margin-bottom: 16px; color: var(--dark);">Berita tidak ditemukan</h2>
                        <p style="color: #666; margin-bottom: 24px;">Artikel yang Anda cari tidak tersedia atau tautan sudah usang.</p>
                        <a href="berita.html" class="btn-kembali">&larr; Kembali ke Daftar Berita</a>
                    </div>
                `;
                return;
            }

            document.getElementById('page-title').innerText = `${berita.judul} - AgroVoice`;
            const gambar = berita.gambar ? 'uploads/' + encodeURIComponent(berita.gambar) : 'https://via.placeholder.com/800x400?text=AgroVoice';
            const tanggal = fmtTanggal(berita.tanggal);

            container.innerHTML = `
                <!-- Kategori & Tanggal -->
                <div class="meta-artikel">
                    <span>${esc(berita.kategori_nama || 'Umum')}</span> &bull; ${esc(tanggal)}
                </div>

                <!-- Judul -->
                <h1>${esc(berita.judul)}</h1>

                <!-- Gambar Utama -->
                <img src="${gambar}" alt="${esc(berita.judul)}" class="gambar-utama">

                <!-- Isi Berita -->
                <div class="isi-artikel">${esc(berita.isi)}</div>

                <!-- Tombol Kembali -->
                <a href="berita.html" class="btn-kembali">&larr; Kembali ke Daftar Berita</a>
            `;
        }

        document.addEventListener('DOMContentLoaded', muatDetailBerita);
    </script>
</body>
</html>
