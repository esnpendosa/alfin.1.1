<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Berita - AgroVoice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(0,0,0,0.1);
            background: #fff;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--agro-green);
            color: #fff;
            border-color: var(--agro-green);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">AgroVoice</a>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="berita.html" style="color: var(--agro-green); opacity: 1;">Berita</a>
                <a href="galeri.html">Galeri</a>
                <div class="nav-dropdown">
                    <select aria-label="Pilih agro" onchange="if(this.value) window.location.href=this.value">
                        <option value="index.html">AgroVoice</option>
                        <option value="uploads/web/agri-perikanan.html">AgriPerikanan</option>
                        <option value="uploads/web/1794879347_agropertanian.html">AgroPertanian</option>
                        <option value="uploads/web/1794879300_agropeternakan.html">AgroPeternakan</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <header style="padding: 120px 20px 30px; text-align: center; background: var(--apple-bg);">
        <h1 style="font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -1px;">Semua <span style="color: var(--agro-green);">Berita.</span></h1>
        <p style="color: var(--text-muted); margin-top: 10px;">Kumpulan informasi terbaru seputar dunia pertanian.</p>
        
        <div class="filter-container" id="filter-kategori">
            <a href="berita.html" class="filter-btn active" data-slug="">Semua</a>
            <a href="berita.html?kategori=agri-perikanan" class="filter-btn" data-slug="agri-perikanan">AgriPerikanan</a>
        </div>
    </header>

    <!-- GRID BERITA -->
    <section class="section-apple white" style="padding-top: 20px; min-height: 450px;">
        <div class="grid-apple" id="daftar-berita">
            <p style="text-align:center; width:100%;">Memuat berita...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 AgroVoice AI. Desain terinspirasi dari Apple.</p>
    </footer>

    <script src="js/data.js"></script>
    <script>
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const urlParams = new URLSearchParams(window.location.search);
        const kategoriFilter = urlParams.get('kategori') || '';

        // Update active filter button
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.getAttribute('data-slug') === kategoriFilter) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        function muatBerita() {
            try {
                let data = (window.AGRO_DATA && window.AGRO_DATA.berita) ? window.AGRO_DATA.berita : [];
                
                if (kategoriFilter) {
                    const kat = (window.AGRO_DATA.kategori || []).find(k => k.slug === kategoriFilter);
                    if (kat) {
                        data = data.filter(b => b.kategori_id === kat.id);
                    }
                }

                const container = document.getElementById('daftar-berita');
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%; color: var(--text-muted); padding: 40px 0;">Belum ada berita di kategori ini.</p>';
                    return;
                }

                data.forEach(b => {
                    const gambar = b.gambar ? 'uploads/' + encodeURIComponent(b.gambar) : 'https://via.placeholder.com/400x200?text=Tanpa+Gambar';
                    container.innerHTML += `
                        <a href="berita_detail.html?id=${b.id}" class="card-apple">
                            <img src="${gambar}" alt="${esc(b.judul)}">
                            <span class="kategori-label">${esc(b.kategori_nama || 'Umum')}</span>
                            <h4>${esc(b.judul)}</h4>
                            <p>${esc(b.ringkasan)}</p>
                        </a>
                    `;
                });
            } catch (error) {
                console.error("Gagal memuat berita:", error);
            }
        }
        document.addEventListener('DOMContentLoaded', muatBerita);
    </script>
</body>
</html>
